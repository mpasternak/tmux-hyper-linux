# tmux-hyper-linux -- CapsLock jako HYPER (keyd)
# Instalacja: ./install.sh  (albo: sudo cp ... /etc/keyd/ && sudo keyd reload)
# Debian/Ubuntu: binarka nazywa sie keyd.rvaiya, nie keyd.
# Skladnia keyd: C- = Ctrl, A- = Alt, S- = Shift, M- = Super (Meta)!
# Komentarze tylko w osobnych liniach (keyd nie zna komentarzy na koncu linii).

[ids]
*
# Wirtualna klawiatura Wispr Flow (dyktowanie) -- keyd ma jej nie przechwytywac.
-1234:5678

[main]
# Caps trzymany = Hyper (Ctrl+Alt+Shift+Super naraz), jak Karabiner na Macu.
# Caps pykniety solo nie robi nic (brak Caps Locka). Klawisz Windows = Super.
capslock = layer(hyper)

# Klawisze NIEzmapowane ponizej: Caps+Q = Ctrl+Alt+Shift+Super+Q
# (do wlasnych skrotow w GNOME/KDE).
# Klawisze zmapowane: te same kody co karabiner-hyper-tmux.json
# -> jeden ~/.tmux.conf dziala na Linuksie, macOS i przez SSH.
[hyper:C-A-S-M]

# --- kanal 1: Shift+Fn ---
# new-window / next-window / previous-window
n = S-f1
right = S-f2
left = S-f3
# select-pane -L / -D / -U
h = S-f4
j = S-f5
k = S-f6
# split-window -v (panel pod)
minus = S-f9
# Caps+strzalka w dol: tez panel pod
down = S-f9
# detach-client: prefix + d zamiast S-F10 (Shift+F10 w GTK = menu kontekstowe)
d = macro(grave d)
# resize-pane -Z (zoom)
z = S-f11
# kill-pane (z potwierdzeniem)
x = S-f12

# --- kanal 2: Ctrl+Shift+Fn ---
# split-window -vb (panel nad)
up = C-S-f1
# choose-tree -Zw (wybor okna)
t = C-S-f3

# --- kanal 3: Alt+Shift+Fn ---
# rename-window
r = A-S-f1
# select-pane -R
l = A-S-f2
# split-window -h (panel po prawej)
backslash = A-S-f3
# split-window -hb (panel po lewej)
slash = A-S-f4
# choose-tree -Zs (wybor sesji)
s = A-S-f5
# last-window
space = A-S-f6
# copy-mode + wyszukiwanie w historii panelu
f = A-S-f7
