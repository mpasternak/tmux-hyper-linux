# =============================================================================
# Minimalny tmux.conf -- mpasternak
# Reload: prefix + r  (albo:  tmux source-file ~/.tmux.conf)
# =============================================================================

# --- Prefix: backtick (`) ---
# Wybrane dla emacs -nw uzytkownika: emacs uzywa praktycznie kazdego Ctrl-letter,
# a backtick w emacsie to tylko self-insert, ktorego utrate latwo zniesc.
# `` (podwojny backtick) wstawia literalny backtick (np. dla markdown code fences).
unbind C-b
set -g prefix `
bind ` send-prefix

# --- Sane defaults ---
set -g base-index 1                      # numeruj okna od 1, nie od 0
setw -g pane-base-index 1                # numeruj panele od 1
set -g renumber-windows on               # po zamknieciu okna -- przenumeruj reszte
set -g history-limit 50000               # bufor scrolla per pane
set -g mouse on                          # klikanie/scroll/resize myszka
set -g escape-time 10                    # default 500ms -- za wolne dla vima
set -g focus-events on                   # propagacja "focus" do appow (vim autoread)
set -g set-clipboard on                  # integracja z systemowym schowkiem (OSC52)
set -g allow-passthrough on              # pozwol applom mowic z terminalem (np. images)
setw -g aggressive-resize on             # nie blokuj rozmiaru przy multi-attach

# Nie zmieniaj nazwy okna automatycznie, jak juz ja recznie nadalem.
set -g allow-rename off
set -g automatic-rename off

# --- Kolory / true-color ---
# 'tmux-256color' wymaga terminfo (Ubuntu: pakiet ncurses-term, macOS Sequoia ma).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,*:RGB"

# --- Rozszerzone klawisze (Shift+Enter, Ctrl+Backspace itp. dla Claude Code) ---
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# --- SSH agent: nie nadpisuj zmiennych w istniejacych panelach przy reattach,
#     ale aktualizuj je dla nowo otwieranych. Symlink z .zshrc i tak laduje rzecz. ---
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT SSH_TTY DISPLAY TERM"

# =============================================================================
# Bindy
# =============================================================================

# Reload configa
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# =============================================================================
# Hyper-direct bindy (bez prefixa)
# Linux: keyd (keyd/default.conf), macOS: Karabiner (tmux-hyper-mac) tlumacza
# Hyper+klawisz -> Shift+F1..F12 / Ctrl+Shift+Fn / Alt+Shift+Fn.
# Kody sa identyczne na obu systemach -> ten sam plik dziala wszedzie.
# =============================================================================
bind -n S-F1  new-window -c "#{pane_current_path}"      # Hyper+N
bind -n S-F2  next-window                                # Hyper+Right
bind -n S-F3  previous-window                            # Hyper+Left
bind -n S-F4  select-pane -L                             # Hyper+H
bind -n S-F5  select-pane -D                             # Hyper+J
bind -n S-F6  select-pane -U                             # Hyper+K
bind -n S-F9  split-window -v -c "#{pane_current_path}"  # Hyper+-  (panel pod)
bind -n S-F10 detach-client                              # Hyper+D
bind -n S-F11 resize-pane -Z                             # Hyper+Z  (zoom toggle)
bind -n S-F12 confirm-before -p "kill panel #P? (y/n)" kill-pane  # Hyper+X

# Hyper-direct na kanale 2 (Ctrl+Shift+Fn) — tylko sloty bez kolizji z macOS Full Keyboard Access
bind -n C-S-F1 split-window -vb -c "#{pane_current_path}"  # Hyper+↑     (panel above)
bind -n C-S-F3 choose-tree -Zw                              # Hyper+T     (window picker)

# Hyper-direct na kanale 3 (Alt+Shift+Fn) — slot wolny od macOS-owych kolizji oraz globalnych shortcut-listenerów
bind -n M-S-F1 command-prompt -I "#W" "rename-window '%%'"  # Hyper+R     (rename window)
bind -n M-S-F2 select-pane -R                                # Hyper+L     (panel w prawo)
bind -n M-S-F3 split-window -h -c "#{pane_current_path}"     # Hyper+|     (panel po prawej) — fizycznie key=\, "|" wizualnie pasuje do pionowego splitu
bind -n M-S-F4 split-window -hb -c "#{pane_current_path}"    # Hyper+/     (panel po lewej)
bind -n M-S-F5 choose-tree -Zs                                # Hyper+S     (session picker)
bind -n M-S-F6 last-window                                    # Hyper+Space (toggle prev window)

# --- Splity: | poziomo, - pionowo, dziedzicz cwd ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Nowe okno tez w tym samym cwd
bind c new-window -c "#{pane_current_path}"

# --- Nawigacja po panelach: hjkl jak vim ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize: HJKL z powtarzaniem (mozesz nacisnac kilka razy bez prefixa) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cycle po oknach: prefix + Tab / prefix + Shift-Tab
bind Tab next-window
bind BTab previous-window

# =============================================================================
# Copy mode (vi-style)
# =============================================================================
setw -g mode-keys vi

# Wejscie do copy-mode: prefix + [   (default tmuxa)
# v -> rozpocznij selekcje, y -> skopiuj, q -> wyjdz
# Schowek: pbcopy na macOS, wl-copy (wl-clipboard) na Linuksie/Wayland.
bind -T copy-mode-vi v send -X begin-selection
if-shell "command -v pbcopy" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# Zaznaczanie mysza: Ptyxis (VTE) nie obsluguje OSC52, wiec na Linuksie
# kopiujemy przez wl-copy. Na Macu bez zmian (OSC52).
if-shell "command -v wl-copy" "set -g copy-command wl-copy"

# Wyszukiwanie w historii panelu (scrollback tmuxa -- terminal go nie widzi,
# wiec Ctrl+Shift+F w Ghostty/Ptyxis nie znajdzie nic powyzej ekranu).
# prefix + /  albo  Caps+F  -> copy-mode + szukanie w gore, przyrostowe
# (podswietla w trakcie pisania, jak Ctrl+F w przegladarce).
bind / copy-mode \; command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
bind -n M-S-F7 copy-mode \; command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }  # Hyper+F
# W copy-mode-vi: Ctrl+R / Ctrl+S przyrostowo w gore / w dol (oprocz / ? n N)
bind -T copy-mode-vi C-r command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
bind -T copy-mode-vi C-s command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental -- "%%" }

# Kolko myszy nad status barem domyslnie robi previous/next-window --
# przy scrollowaniu historii latwo "przeskoczyc" o okno wstecz. Wylaczone.
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# =============================================================================
# Status bar (minimalny, czytelny)
# =============================================================================
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=colour235 fg=colour250"
set -g status-left  " #[bold]#S#[nobold] "
set -g status-left-length 30
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M "
set -g status-right-length 40

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=colour238,fg=colour15,bold] #I:#W #[default]"

# Wyrozniaj aktywny pane subtelna ramka
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour244"

# Kursor: czerwony migajacy blok (zeby tmux nie nadpisywal ustawien terminala)
set -g cursor-style blinking-block
set -g cursor-colour "#ff2020"
